<app-header></app-header>
<div class="card m-auto continer-fluid my-2" style="width: 100%; border: none;">
    <div class="card-header bg-secondary" style="color: white; text-align: center;">
       <b style="text-align: center;">Rank Details</b> 
    </div>
    <div class="card-body p-0 " style="height: 73vh;overflow-y: auto; margin: 20px;">
      <ul class="list-group" *ngFor="let item of rankDetails"  >
        <li class="list-group-item mb-1" aria-current="true">
          <div class="row">
            <!-- <div class="col-2 m-auto">
              <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16">
                <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
              </svg>
            </div> -->
            <div class="col-6 p-0">
              <div class="ms-2 me-auto">
                <div class="fw-bold">{{item.fullName}}</div>
                <span style="font-size: 12px;">{{item.churchName}}</span>
              </div>
            </div>
            <div class="col-3 p-0">
              <div class="ms-2 me-auto">
                <div class="fw-bold">Marks</div>
                <span style="font-size: 12px;">{{item.score}} / {{item.totalScore}}</span>
              </div>
            </div>
            <div class="col-3 d-flex" style="align-items: center; text-align: right;justify-content: flex-end; padding: 0px ;">
              <!-- Marks: <span > <h6 class="mx-2 m-auto"><b>{{item.score}}</b></h6></span> -->
               Rank: <span ><h1 class="mx-2 m-auto">{{item.rank}}</h1></span>
              
            </div>

            </div> -->
          </div>
        </li>
      
      </ul>
    </div>
    </div>
    <div class="pt-1 mb-4" style="text-align: center;">
        <button data-mdb-button-init data-mdb-ripple-init class="btn btn-primary btn-lg btn-block" type="button" (click)="goBack()">Go To Dashboard</button>
      </div>
