<div class="registrationid-modal-container text-center mb-3">
    <div class="form-group mt-3 text-center mb-3 col-10 m-auto">
        <label for="mobileNumber" class="form-label"> <strong>Enter your mobile number to get your Registration ID</strong></label>
        <input type="tel" id="mobileNumber" [(ngModel)]="mobileNumber" placeholder="Enter mobile number" class="form-control mobile-input col-9 m-auto">
    </div>
    <button class="submit-btn btn btn-primary w-100 col-6" (click)="getRegistrationID()">Get Registration ID</button>
    
    <!-- <div *ngIf="registrationID" class="result mt-4">
        Your Registration ID is: <strong>{{ registrationID }}</strong>
    </div> -->

    <div *ngIf="users && users.length > 0" class="alert alert-success col-10 m-auto mt-3" role="alert">
       
        <p class="mb-2"><strong>Your Details :</strong></p>
        <div class="table ">
            <div *ngFor="let user of users; let i = index" > 
            <div class="row m-auto col-12 mb-2">
                <div class="col-8 text-start">{{i+1}}. {{ user.fullName }} </div>
                <div class="col-4 text-start" (click)="copyLink(user.registrationID)"><strong> {{ user.registrationID }}</strong></div>
            </div>
            <!-- <h1 (click)="copyLink(user.registrationID)" class="copy-text"><u>{{ user.registrationID }}</u></h1> -->
        </div>
        </div>
        

        <p class="mt-3">Join our WhatsApp group for updates</p>
        <a [href]="whatsAppLink" target="_blank" class="btn btn-success w-100">Join WhatsApp Group</a>

        <a routerLink="register" class="btn btn-primary w-100 mt-3" (click)="closeModal()">New Registration</a>
    </div>
    
    <div *ngIf="errorMessage" class="alert alert-danger mt-3" role="alert">
        {{ errorMessage }}
    </div>
    <div class="spinner-border text-primary" role="status" *ngIf="loader" style="position: absolute;
    top: 76%;
    left: 47%;
    scale: 2;">
    </div>
</div>
