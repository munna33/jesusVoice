<div class="card m-auto continer-fluid my-2" style="width: 100%; border: none">
  
  <div class="card-body">
    <div class="card-header bg-secondary" style="color: white" (click)="enableFileUpload = !enableFileUpload">
      <b>Upload Documents </b>
    </div>
    <div  class="alert alert-success">
      <select [(ngModel)]="parentCollection" class="form-control mb-2">
        <option value="" disabled selected>Select Collection</option>
        <option *ngFor="let collection of parentCollections" [value]="collection">{{ collection }}</option>
      </select>

      <label for="fileUpload" class="btn btn-primary">
        <i class="fa fa-upload"></i> Upload File
      </label>
      <input
        type="file"
        id="fileUpload"
        (change)="onFileSelected($event)"
        style="display: none"
      />
      <span *ngIf="file">{{ file.name }}</span>
      <button
        class="btn btn-block bg-primary my-3 me-2"
        style="color: white"
        (click)="addBulkUser()"
      >
        Add Bulk User
      </button>
    </div>
