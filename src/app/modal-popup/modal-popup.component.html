
<div class="card m-auto continer-fluid" style="width: 100%; border: none; margin-top: 0 !important;">
    <div class="card-header bg-secondary" style="color: white;">
       <b>{{title}}</b> 
    </div>
    <div class="card-body" style="padding-left: 0px; padding-right: 0px;">
      <ul class="list-group" style="padding: 5px;">  
        <li class="list-group-item d-flex justify-content-between align-items-center" >
         <b>Day : </b> {{data.Day}} 
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center" >
         <b>Your Score :</b> {{data.Score}}
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center" >
         <b>Your Answer :</b> {{data.Answer}}
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center" >
          <b>Reference :</b>{{data.Reference}}
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center" *ngIf="questionData">
            <b>{{questionData?.items?.title?.split('?')[0]}} ?</b>
          </li>
        <div class="pt-1 mb-4 my-2" style="text-align: center;">
            <button data-mdb-button-init data-mdb-ripple-init class="btn btn-primary bg-primary btn-lg btn-block" type="button" (click)="getQuestion()">Gett Question</button>
          </div>
         
      </ul>
    </div>
 </div>
