<section class="vh-100">
    <div class="container-fluid">
      <div class="row">
        <div class="col-sm-6 text-black m-auto">
  
          <div class="px-5 ms-xl-4 my-5" style="text-align: center;">
            <i class="fas fa-crow fa-2x me-3 pt-5 mt-xl-4 " style="color: #709085; "></i>
            <span class="h2 fw-bold mb-0">Bible Study 180 Days <h3>Online Quiz</h3></span>
            <h4 class="my-3">Week 1</h4>
          </div>
  
          <div class="d-flex align-items-center h-custom-2 px-5 ms-xl-4 mt-5 pt-5 pt-xl-0 mt-xl-n5">
  
            <form style="width: 23rem;">
  
              <h3 class="fw-normal mb-3 pb-3" style="letter-spacing: 1px; text-align: center;">Log in</h3>
  
              <div data-mdb-input-init class="form-outline mb-4">
                <label class="form-label" for="fullName">Full Name</label>
                <input type="text" [(ngModel)]="fullName" [ngModelOptions]="{standalone: true}" id="fullName" class="form-control form-control-lg" />
                
              </div>
  
              <div data-mdb-input-init class="form-outline mb-4">
                <label class="form-label" for="regId">Registration ID</label>
                <input type="text" [(ngModel)]="regID" [ngModelOptions]="{standalone: true}" id="regId" class="form-control form-control-lg" />
              </div>
  
              <div class="pt-1 mb-4" style="text-align: center;">
                <button data-mdb-button-init data-mdb-ripple-init class="btn btn-info btn-lg btn-block" type="button" (click)="login()">Log In</button>
              </div>
            </form>
  
          </div>
  
        </div>
       
      </div>
    </div>
  </section>
  <div class="spinner-border text-primary" role="status" *ngIf="loader" style="position: absolute;
  top: 76%;
  left: 47%;
  scale: 2;">
  </div>
